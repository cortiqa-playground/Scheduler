name: Testing cache deploy

on:
  push:
    branches:
      - develop
      - feature/cache

  workflow_dispatch:


jobs:
  build-firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        uses: actions/setup-node@v4
        with: 
          node-version: '20'
          check-latest: true

      - name: Checkout
        uses: actions/checkout@v4

      - run: |
          npm install
        
      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install node
        uses: actions/setup-node@v4
        with:
          flutter-version: '20'
          channel: 'stable'
          cache: true
          cache-key: 'node-:os:-:channel:-:version:-:arch:-:hash:' 
          cache-path: '${{ runner.tool_cache }}/node/:channel:-:version:-:arch:'
