name: Testing cache deploy

on:
  push:
    branches:
      - develop
      - feature/cache

  workflow_dispatch:


jobs:
  build-firebase-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20.12.1'
          key: 'node-:os:-:channel:-:version:-:arch:-:hash:' 
          cache-dependency-path: '${{ runner.tool_cache }}/node/:channel:-:version:-:arch:'
